# Staging (EC2 Ubuntu). File độc lập, KHÔNG gộp với docker-compose.yml: server chỉ cần file này
# + .env.staging, image được kéo từ ECR (không build trên server).
#
#   APP_IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/iweb-devops:<tag> \
#     docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
name: iweb-devops-staging

services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE chưa được đặt}
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
    # Không publish ra ngoài: chỉ Caddy (cùng network) gọi vào app:8080. Người dùng vào qua Caddy (80/443).
    expose:
      - "8080"
    restart: unless-stopped
    # Gửi stdout/stderr của app (Laravel log, nginx access) lên CloudWatch Logs. Cần IAM role của EC2 có
    # quyền logs:CreateLogStream/PutLogEvents và log group đã tạo sẵn.
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-southeast-1
        awslogs-group: /iweb-devops/staging/app
        awslogs-stream: app
    networks:
      - iweb

  # Reverse proxy + HTTPS tự động (Let's Encrypt). Nhận 80/443 của EC2 rồi chuyển vào app:8080.
  caddy:
    image: caddy:2
    environment:
      # Đọc từ .env.staging (--env-file), dùng trong Caddyfile.staging qua {$BASIC_AUTH_*}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USER chưa được đặt}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?BASIC_AUTH_HASH chưa được đặt}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      # Lưu chứng chỉ: mất volume này là phải xin lại, dễ chạm giới hạn của Let's Encrypt
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - iweb

  db:
    image: mysql:8.0
    env_file:
      - .env.staging
    # EC2 t3.small chỉ có 2 GB RAM: giảm bộ nhớ MySQL cho nhẹ.
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=50
    volumes:
      - db_data:/var/lib/mysql
    # Không publish cổng 3306: chỉ app trong network nội bộ truy cập được DB.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - iweb

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  iweb:
