# Base: định nghĩa 2 service dùng chung cho mọi môi trường.
# Phần riêng của từng môi trường nằm ở:
#   - docker-compose.override.yml  (Dev/Local - tự động được nạp)
#   - docker-compose.staging.yml   (Staging - Bước 4)
name: iweb-devops

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - iweb

  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - iweb

volumes:
  db_data:

networks:
  iweb:
